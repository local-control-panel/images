name: Build & Push Images

on:
  push:
    branches: [main]
    paths:
      - "frankenphp/**"
      - "mariadb/**"
      - "valkey/**"
      - "versions.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      frankenphp: ${{ steps.v.outputs.frankenphp }}
      frankenphp_php_versions: ${{ steps.v.outputs.frankenphp_php_versions }}
      frankenphp_php_default: ${{ steps.v.outputs.frankenphp_php_default }}
      mariadb: ${{ steps.v.outputs.mariadb }}
      valkey: ${{ steps.v.outputs.valkey }}
    steps:
      - uses: actions/checkout@v4

      - name: Read versions.json
        id: v
        run: |
          echo "frankenphp=$(jq -r '.images.frankenphp.version' versions.json)" >> $GITHUB_OUTPUT
          echo "frankenphp_php_versions=$(jq -c '.images.frankenphp.phpVersions' versions.json)" >> $GITHUB_OUTPUT
          echo "frankenphp_php_default=$(jq -r '.images.frankenphp.phpDefault' versions.json)" >> $GITHUB_OUTPUT
          echo "mariadb=$(jq -r '.images.mariadb.version' versions.json)" >> $GITHUB_OUTPUT
          echo "valkey=$(jq -r '.images.valkey.version' versions.json)" >> $GITHUB_OUTPUT

  frankenphp:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.versions.outputs.frankenphp_php_versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/frankenphp:${{ needs.versions.outputs.frankenphp }}-php${{ matrix.php }}"
          if [ "${{ matrix.php }}" = "${{ needs.versions.outputs.frankenphp_php_default }}" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository_owner }}/frankenphp:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: ./frankenphp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRANKENPHP_VERSION=${{ needs.versions.outputs.frankenphp }}
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=frankenphp-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=frankenphp-${{ matrix.php }}

  mariadb:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./mariadb
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: MARIADB_VERSION=${{ needs.versions.outputs.mariadb }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mariadb:${{ needs.versions.outputs.mariadb }}
            ghcr.io/${{ github.repository_owner }}/mariadb:latest
          cache-from: type=gha,scope=mariadb
          cache-to: type=gha,mode=max,scope=mariadb

  valkey:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./valkey
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VALKEY_VERSION=${{ needs.versions.outputs.valkey }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/valkey:${{ needs.versions.outputs.valkey }}
            ghcr.io/${{ github.repository_owner }}/valkey:latest
          cache-from: type=gha,scope=valkey
          cache-to: type=gha,mode=max,scope=valkey
