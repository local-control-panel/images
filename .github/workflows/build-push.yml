name: Build & Push Images

on:
  push:
    branches: [main]
    paths:
      - "frankenphp/**"
      - "mariadb/**"
      - "valkey/**"
      - "postgres/**"
      - "meilisearch/**"
      - "versions.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      frankenphp: ${{ steps.v.outputs.frankenphp }}
      frankenphp_php_versions: ${{ steps.v.outputs.frankenphp_php_versions }}
      frankenphp_php_default: ${{ steps.v.outputs.frankenphp_php_default }}
      mariadb: ${{ steps.v.outputs.mariadb }}
      valkey: ${{ steps.v.outputs.valkey }}
      postgres: ${{ steps.v.outputs.postgres }}
      meilisearch: ${{ steps.v.outputs.meilisearch }}
      frankenphp_changed: ${{ steps.changes.outputs.frankenphp }}
      mariadb_changed: ${{ steps.changes.outputs.mariadb }}
      valkey_changed: ${{ steps.changes.outputs.valkey }}
      postgres_changed: ${{ steps.changes.outputs.postgres }}
      meilisearch_changed: ${{ steps.changes.outputs.meilisearch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read versions.json
        id: v
        run: |
          echo "frankenphp=$(jq -r '.images.frankenphp.version' versions.json)" >> $GITHUB_OUTPUT
          echo "frankenphp_php_versions=$(jq -c '.images.frankenphp.phpVersions' versions.json)" >> $GITHUB_OUTPUT
          # No static `phpDefault` field - the recommended PHP version is
          # computed as the middle of the "supported" runtimes by version,
          # same rule as src-tauri/src/image_catalog.rs's
          # default_runtime_tuple/src/shared/image-catalog.ts's
          # defaultRuntime, so the `:latest` tag below tracks whichever
          # version the app itself would actually recommend.
          echo "frankenphp_php_default=$(jq -r '
            [.images.frankenphp.runtimes[] | select(.supportStatus == "supported")]
            | sort_by(.phpVersion | split(".") | map(tonumber))
            | .[(length - 1) / 2 | floor]
            | .phpVersion
          ' versions.json)" >> $GITHUB_OUTPUT
          echo "mariadb=$(jq -r '.images.mariadb.version' versions.json)" >> $GITHUB_OUTPUT
          echo "valkey=$(jq -r '.images.valkey.version' versions.json)" >> $GITHUB_OUTPUT
          echo "postgres=$(jq -r '.images.postgres.version' versions.json)" >> $GITHUB_OUTPUT
          echo "meilisearch=$(jq -r '.images.meilisearch.version' versions.json)" >> $GITHUB_OUTPUT

      # Per-image change detection: an image is "changed" if its build
      # context directory touched, or its versions.json entry differs from
      # the previous commit. workflow_dispatch ignores these outputs
      # entirely (see per-job `if:` below) and always builds everything.
      - name: Detect changed images
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ] \
             && [ -n "$BASE_SHA" ] \
             && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            BASE="$BASE_SHA"
          else
            BASE=""
          fi

          changed() {
            key="$1"
            if [ -z "$BASE" ]; then
              echo true
              return
            fi
            if ! git diff --quiet "$BASE" HEAD -- "$key/"; then
              echo true
              return
            fi
            old=$(git show "$BASE:versions.json" 2>/dev/null | jq -c ".images.$key" 2>/dev/null)
            new=$(jq -c ".images.$key" versions.json)
            if [ "$old" != "$new" ]; then
              echo true
            else
              echo false
            fi
          }

          echo "frankenphp=$(changed frankenphp)" >> "$GITHUB_OUTPUT"
          echo "mariadb=$(changed mariadb)" >> "$GITHUB_OUTPUT"
          echo "valkey=$(changed valkey)" >> "$GITHUB_OUTPUT"
          echo "postgres=$(changed postgres)" >> "$GITHUB_OUTPUT"
          echo "meilisearch=$(changed meilisearch)" >> "$GITHUB_OUTPUT"

  # Built natively per-platform (no QEMU) and merged into one manifest below,
  # since arm64 under QEMU emulation is 5-10x slower for compiling PHP
  # extensions than running on a real arm64 runner.
  frankenphp-build:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.frankenphp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.versions.outputs.frankenphp_php_versions) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        run: echo "PLATFORM_SLUG=${PLATFORM/\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ./frankenphp
          platforms: ${{ matrix.platform }}
          build-args: |
            FRANKENPHP_VERSION=${{ needs.versions.outputs.frankenphp }}
            PHP_VERSION=${{ matrix.php }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/frankenphp,push-by-digest=true,name-canonical=true,push=true
          # gha cache is fast but evicted after 7 days / 10GB; the registry
          # cache is slower but persists across the long gaps between
          # FrankenPHP/PHP version bumps. Scoped per php+platform (not one
          # shared buildcache tag) since matrix legs push concurrently and
          # would otherwise clobber each other's cache.
          cache-from: |
            type=gha,scope=frankenphp-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/frankenphp:buildcache-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
          cache-to: |
            type=gha,mode=max,scope=frankenphp-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/frankenphp:buildcache-${{ matrix.php }}-${{ env.PLATFORM_SLUG }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.php }}-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  frankenphp-merge:
    needs: [versions, frankenphp-build]
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.frankenphp_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.versions.outputs.frankenphp_php_versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.php }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/frankenphp:${{ needs.versions.outputs.frankenphp }}-php${{ matrix.php }}"
          if [ "${{ matrix.php }}" = "${{ needs.versions.outputs.frankenphp_php_default }}" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository_owner }}/frankenphp:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/--tag /' | tr '\n' ' ') \
            $(printf 'ghcr.io/${{ github.repository_owner }}/frankenphp@sha256:%s ' *)

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/frankenphp:${{ needs.versions.outputs.frankenphp }}-php${{ matrix.php }}
          format: sarif
          output: trivy-frankenphp.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frankenphp.sarif
          category: trivy-frankenphp-php${{ matrix.php }}

  mariadb:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.mariadb_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No custom Dockerfile — config is delivered via bind mount at runtime
      # (see mariadb/docker-compose.yml), so we just re-tag the upstream
      # multi-arch image under our fixed ghcr.io tag instead of rebuilding it.
      - name: Re-tag upstream image
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/mariadb:${{ needs.versions.outputs.mariadb }} \
            --tag ghcr.io/${{ github.repository_owner }}/mariadb:latest \
            mariadb:${{ needs.versions.outputs.mariadb }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/mariadb:${{ needs.versions.outputs.mariadb }}
          format: sarif
          output: trivy-mariadb.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-mariadb.sarif
          category: trivy-mariadb

  valkey:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.valkey_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No custom Dockerfile — config is delivered via bind mount at runtime
      # (see valkey/docker-compose.yml), so we just re-tag the upstream
      # multi-arch image under our fixed ghcr.io tag instead of rebuilding it.
      - name: Re-tag upstream image
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/valkey:${{ needs.versions.outputs.valkey }} \
            --tag ghcr.io/${{ github.repository_owner }}/valkey:latest \
            valkey/valkey:${{ needs.versions.outputs.valkey }}-alpine

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/valkey:${{ needs.versions.outputs.valkey }}
          format: sarif
          output: trivy-valkey.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-valkey.sarif
          category: trivy-valkey

  postgres:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.postgres_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No custom Dockerfile — config is delivered via bind mount at runtime
      # (see postgres/docker-compose.yml), so we just re-tag the upstream
      # multi-arch image under our fixed ghcr.io tag instead of rebuilding it.
      - name: Re-tag upstream image
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/postgres:${{ needs.versions.outputs.postgres }} \
            --tag ghcr.io/${{ github.repository_owner }}/postgres:latest \
            postgres:${{ needs.versions.outputs.postgres }}-alpine

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/postgres:${{ needs.versions.outputs.postgres }}
          format: sarif
          output: trivy-postgres.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-postgres.sarif
          category: trivy-postgres

  meilisearch:
    needs: versions
    if: github.event_name == 'workflow_dispatch' || needs.versions.outputs.meilisearch_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No custom Dockerfile — nothing to bake in beyond the healthcheck,
      # which lives in compose. Just re-tag the upstream multi-arch image
      # under our fixed ghcr.io tag instead of rebuilding it.
      - name: Re-tag upstream image
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/meilisearch:${{ needs.versions.outputs.meilisearch }} \
            --tag ghcr.io/${{ github.repository_owner }}/meilisearch:latest \
            getmeili/meilisearch:v${{ needs.versions.outputs.meilisearch }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/meilisearch:${{ needs.versions.outputs.meilisearch }}
          format: sarif
          output: trivy-meilisearch.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-meilisearch.sarif
          category: trivy-meilisearch
