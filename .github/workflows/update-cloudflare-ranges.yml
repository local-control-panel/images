name: Update Cloudflare Proxy Ranges

on:
  schedule:
    # First day of every month at 09:00 UTC.
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — check the ranges without opening a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-ranges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch and validate Cloudflare ranges
        id: ranges
        run: node .github/scripts/update-cloudflare-ranges.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Show diff
        if: steps.ranges.outputs.changed == 'true'
        run: git diff -- frankenphp/caddy-global/trusted-proxies/cloudflare.caddyfile

      - name: Create pull request
        if: steps.ranges.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/cloudflare-ranges-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore: update Cloudflare proxy ranges"
          title: "chore: update Cloudflare proxy ranges"
          body: |
            Updates the static Cloudflare CIDR list used by
            CADDY_TRUSTED_PROXIES=cloudflare.

            Source: https://www.cloudflare.com/ips-v4 and
            https://www.cloudflare.com/ips-v6

            Merging this PR triggers the existing FrankenPHP image build.
          labels: |
            dependencies
            security
