name: Update Cloudflare Proxy Ranges

on:
  schedule:
    # First day of every month at 09:00 UTC.
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — check the ranges without opening a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automated-pr-cloudflare-ranges
  cancel-in-progress: true

jobs:
  check-ranges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch and validate Cloudflare ranges
        id: ranges
        run: node .github/scripts/update-cloudflare-ranges.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Show diff
        if: steps.ranges.outputs.changed == 'true'
        run: git diff -- frankenphp/caddy-global/trusted-proxies/cloudflare.caddyfile

      - name: Create pull request
        id: cpr
        if: steps.ranges.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/cloudflare-ranges
          delete-branch: true
          assignees: mrgkanev
          reviewers: mrgkanev
          commit-message: "chore: update Cloudflare proxy ranges"
          title: "chore: update Cloudflare proxy ranges"
          body: |
            Updates the static Cloudflare CIDR list used by
            CADDY_TRUSTED_PROXIES=cloudflare.

            Source: https://www.cloudflare.com/ips-v4 and
            https://www.cloudflare.com/ips-v6

            Merging this PR triggers the existing FrankenPHP image build.
          labels: |
            dependencies
            security

      - name: Close superseded Cloudflare range PRs
        if: steps.ranges.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const current = Number('${{ steps.cpr.outputs.pull-request-number }}');
            const candidates = pulls.filter(
              (pull) => pull.head.ref.startsWith('chore/cloudflare-ranges') && pull.number !== current,
            );
            for (const pull of candidates) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body: 'Superseded by a newer automated Cloudflare range update.',
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: 'closed',
              });
            }
