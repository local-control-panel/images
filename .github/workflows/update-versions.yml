name: Update Docker Versions

on:
  schedule:
    # 08:00 UTC on the 1st of every month
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print detected versions but do not open a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automated-pr-docker-versions
  cancel-in-progress: true

jobs:
  check-versions:
    name: Check & update image versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Detect latest versions from Docker Hub
        id: versions
        run: node .github/scripts/check-docker-versions.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Show diff
        if: steps.versions.outputs.changed == 'true'
        run: git diff versions.json

      - name: Create Pull Request
        id: cpr
        if: steps.versions.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/docker-versions
          delete-branch: true
          assignees: mrgkanev
          reviewers: mrgkanev
          commit-message: "chore: update Docker image versions (${{ steps.versions.outputs.date }})"
          title: "chore: Docker image version updates (${{ steps.versions.outputs.date }})"
          body: |
            ## Docker image version updates

            Automated monthly check detected new versions.

            | Service | Old | New |
            |---------|-----|-----|
            ${{ steps.versions.outputs.table }}

            ### New major release lines (not applied automatically)

            Major versions are introduced as parallel selectable runtimes/data
            services with their own lifecycle and volumes. They never replace
            an existing default automatically.

            | Service | Current line | New upstream candidate |
            |---------|--------------|------------------------|
            ${{ steps.versions.outputs.major_candidates }}

            ### Platform support
            All images support `linux/amd64` and `linux/arm64` — runs natively on:
            - x86_64 servers (amd64)
            - Apple Silicon / ARM servers (arm64)
            - AWS Graviton, Ampere, Raspberry Pi

            > Generated by `.github/workflows/update-versions.yml`
          labels: |
            dependencies
            docker

      - name: Close superseded Docker version PRs
        if: steps.versions.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:chore/docker-versions`,
            });
            const current = Number('${{ steps.cpr.outputs.pull-request-number }}');
            for (const pull of pulls.filter((pull) => pull.number !== current)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body: 'Superseded by a newer automated Docker version update.',
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                state: 'closed',
              });
            }
