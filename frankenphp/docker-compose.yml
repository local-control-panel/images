services:
  frankenphp:
    # Our GHCR image contains the PHP extensions, WP-CLI, entrypoint helpers
    # and Caddy platform configuration defined in this repository.
    image: ${WCP_FRANKENPHP_IMAGE:-ghcr.io/local-control-panel/frankenphp:${FRANKENPHP_VERSION:-1}-php${PHP_VERSION:-8.3}}
    container_name: frankenphp
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false   # falls back to inline defaults if .env absent
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./php.ini:/usr/local/etc/php/conf.d/wp-performance.ini:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/frankenphp/Caddyfile.d:/etc/frankenphp/Caddyfile.d:ro
      - /var/www:/var/www
      - /var/log/caddy:/var/log/caddy
    environment:
      # off | cloudflare | private. See caddy-global/trusted-proxies/.
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-off}
      CADDY_LOG_LEVEL: ${CADDY_LOG_LEVEL:-INFO}
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:

networks:
  backend:
    external: true
    name: wp-backend
