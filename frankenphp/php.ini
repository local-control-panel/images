; WordPress performance tuning for FrankenPHP

[PHP]
memory_limit             = 256M
max_execution_time       = 60
max_input_time           = 60
post_max_size            = 128M
upload_max_filesize      = 128M
max_input_vars           = 5000
expose_php               = Off
allow_url_fopen          = Off
allow_url_include        = Off
disable_functions        = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; OPcache — critical for PHP performance
[opcache]
opcache.enable           = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; set to 1 during development
opcache.revalidate_freq  = 0
opcache.save_comments    = 1      ; required by some WP plugins
opcache.enable_cli       = 0
opcache.jit              = tracing
opcache.jit_buffer_size  = 64M
opcache.fast_shutdown    = 1
opcache.huge_code_pages  = 1

; Session
session.gc_maxlifetime   = 1440
session.cookie_httponly  = 1
session.cookie_secure    = 1
session.use_strict_mode  = 1
session.save_handler     = redis
session.save_path        = "tcp://valkey:6379?database=1"

; Error handling (disable in production)
display_errors           = Off
log_errors               = On
error_log                = /dev/stderr
ignore_repeated_errors   = On
