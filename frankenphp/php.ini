; Shared production defaults for FrankenPHP applications.
; App-specific settings belong in an application image or its own PHP config;
; this file must remain safe for WordPress, Laravel and generic PHP apps.

[PHP]
memory_limit             = 256M
max_execution_time       = 60
max_input_time           = 60
post_max_size            = 128M
upload_max_filesize      = 128M
max_input_vars           = 5000
expose_php               = Off
allow_url_include        = Off
date.timezone            = UTC
realpath_cache_size      = 4096K    ; reduces stat() syscalls — WordPress makes ~20-30 per request
realpath_cache_ttl       = 3600

; OPcache — critical for PHP performance
[opcache]
opcache.enable           = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 20000
; Code is currently host-mounted for many deployments. Keep timestamp checks
; on by default so plugin/application updates are not served stale until a
; container restart. Immutable application images can override these values.
opcache.validate_timestamps = 1
opcache.revalidate_freq  = 2
opcache.save_comments    = 1      ; required by some WP plugins
opcache.enable_cli       = 0
; JIT adds per-process memory and is rarely a net benefit for I/O-heavy web
; apps. Enable it only after a workload-specific benchmark.
opcache.jit              = off
opcache.jit_buffer_size  = 0
opcache.fast_shutdown    = 1
opcache.huge_code_pages  = 1

; Session defaults. Redis/Valkey is selected by the application, not globally:
; a shared multi-app image must also work when Valkey is not present.
session.gc_maxlifetime   = 1440
session.cookie_httponly  = 1
session.cookie_samesite  = Lax
session.cookie_lifetime  = 0
session.use_strict_mode  = 1

; Error handling (disable in production)
display_errors           = Off
log_errors               = On
error_log                = /dev/stderr
ignore_repeated_errors   = On
