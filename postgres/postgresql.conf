# PostgreSQL performance tuning for WCP hosting stack
# Adjust values to match your VPS RAM (these defaults assume 2GB available for Postgres)

# Memory
shared_buffers            = 256MB          # ~25% of available RAM
work_mem                  = 16MB           # per-sort/hash operation; multiply by max_connections for total
maintenance_work_mem      = 64MB           # for VACUUM, CREATE INDEX, etc.
effective_cache_size      = 768MB          # planner hint: how much OS + PG cache is available

# WAL / checkpoints
wal_buffers               = 16MB
checkpoint_completion_target = 0.9         # spread checkpoint I/O over 90% of checkpoint interval
max_wal_size              = 1GB
min_wal_size              = 80MB

# Query planner
random_page_cost          = 1.1            # SSD assumption — lowers this vs spinning disk default of 4.0
effective_io_concurrency  = 200            # SSD: raise to 200; HDD: leave at 2
default_statistics_target = 100            # more accurate query plans

# Connections
max_connections           = 100

# Logging (mirrors MariaDB slow-query pattern)
log_min_duration_statement = 2000          # log queries slower than 2s
log_line_prefix           = '%t [%p]: '

# Locale
lc_messages               = 'en_US.utf8'
lc_monetary               = 'en_US.utf8'
lc_numeric                = 'en_US.utf8'
lc_time                   = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
