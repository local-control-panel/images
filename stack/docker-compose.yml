# Full WordPress hosting stack — remote servers
# Uses official images + volume-mounted configs.
#
# 1. cp ../.env.example ../.env
# 2. Edit ../.env (versions + passwords)
# 3. docker compose up -d

services:

  # ── Web server + PHP runtime ──────────────────────────────────────────────
  frankenphp:
    image: dunglas/frankenphp:${FRANKENPHP_VERSION:-1}-php${PHP_VERSION:-8.3}
    container_name: frankenphp
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frankenphp/php.ini:/usr/local/etc/php/conf.d/wp-performance.ini:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/frankenphp/Caddyfile.d:/etc/frankenphp/Caddyfile.d:ro
      - /var/www:/var/www
      - /var/log/caddy:/var/log/caddy
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      FRANKENPHP_WORKER_PROCESSES: ${WORKER_PROCESSES:-4}
    cap_add:
      - NET_ADMIN
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Secondary PHP version containers ─────────────────────────────────────
  # Handle sites that require a different PHP version than the default (8.3).
  # The main frankenphp container reverse-proxies to them by domain.
  # Started on demand via --profile php-8.X — not running by default.

  frankenphp-8.1:
    image: dunglas/frankenphp:${FRANKENPHP_VERSION:-1}-php8.1
    container_name: frankenphp-8.1
    restart: unless-stopped
    profiles: ["php-8.1"]
    volumes:
      - ../frankenphp/Caddyfile.secondary:/etc/caddy/Caddyfile:ro
      - ../frankenphp/php.ini:/usr/local/etc/php/conf.d/wp-performance.ini:ro
      - /etc/frankenphp-8.1/Caddyfile.d:/etc/frankenphp/Caddyfile.d:ro
      - /var/www:/var/www
      - /var/log/caddy:/var/log/caddy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  frankenphp-8.2:
    image: dunglas/frankenphp:${FRANKENPHP_VERSION:-1}-php8.2
    container_name: frankenphp-8.2
    restart: unless-stopped
    profiles: ["php-8.2"]
    volumes:
      - ../frankenphp/Caddyfile.secondary:/etc/caddy/Caddyfile:ro
      - ../frankenphp/php.ini:/usr/local/etc/php/conf.d/wp-performance.ini:ro
      - /etc/frankenphp-8.2/Caddyfile.d:/etc/frankenphp/Caddyfile.d:ro
      - /var/www:/var/www
      - /var/log/caddy:/var/log/caddy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  frankenphp-8.4:
    image: dunglas/frankenphp:${FRANKENPHP_VERSION:-1}-php8.4
    container_name: frankenphp-8.4
    restart: unless-stopped
    profiles: ["php-8.4"]
    volumes:
      - ../frankenphp/Caddyfile.secondary:/etc/caddy/Caddyfile:ro
      - ../frankenphp/php.ini:/usr/local/etc/php/conf.d/wp-performance.ini:ro
      - /etc/frankenphp-8.4/Caddyfile.d:/etc/frankenphp/Caddyfile.d:ro
      - /var/www:/var/www
      - /var/log/caddy:/var/log/caddy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  # ── Database ──────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    container_name: mariadb
    restart: unless-stopped
    command: --innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-1024M}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wp}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?required}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../mariadb/conf.d:/etc/mysql/conf.d:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Object cache ──────────────────────────────────────────────────────────
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8}-alpine
    container_name: valkey
    restart: unless-stopped
    command: valkey-server /etc/valkey/valkey.conf
    volumes:
      - ../valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Relational DB (optional) ──────────────────────────────────────────────
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DATABASE:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    profiles:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Full-text search (optional) ───────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v${MEILISEARCH_VERSION:-1.13}
    container_name: meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?required}
      MEILI_ENV: production
      MEILI_DB_PATH: /meili_data
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - backend
    profiles:
      - meilisearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  valkey_data:
  postgres_data:
  meilisearch_data:

networks:
  backend:
    driver: bridge
    name: wp-backend
