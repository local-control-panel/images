services:
  valkey:
    image: ghcr.io/local-control-panel/valkey:${VALKEY_VERSION:-8}
    container_name: valkey
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    # The start script writes the ACL file from VALKEY_ADMIN_PASSWORD, then
    # hands over to the image's entrypoint (which drops root).
    command: ["sh", "/etc/valkey/wcp-valkey-start.sh"]
    environment:
      VALKEY_ADMIN_PASSWORD: ${VALKEY_ADMIN_PASSWORD:?required}
    volumes:
      - ./valkey.conf:/etc/valkey/valkey.conf:ro
      - ./wcp-valkey-start.sh:/etc/valkey/wcp-valkey-start.sh:ro
      - ./wcp-valkey-cli.sh:/etc/valkey/wcp-valkey-cli.sh:ro
      - valkey_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "sh", "/etc/valkey/wcp-valkey-cli.sh", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  valkey_data:

networks:
  backend:
    external: true
    name: ${WCP_BACKEND_NETWORK:-wcp_backend}
