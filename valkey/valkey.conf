# Valkey (Redis-compatible) — WordPress object cache

# Memory
maxmemory 256mb
# allkeys-lru: evicts least-recently-used keys when full — best for WP object cache
maxmemory-policy allkeys-lru

# Persistence — save to disk every 5 min if ≥1 key changed
# Disable with: save "" if you want pure in-memory cache
save 300 1
save 60 1000

# Network
bind 0.0.0.0
protected-mode no       # safe because the container is on the private backend network
port 6379
tcp-backlog 511
tcp-keepalive 300

# Performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
activerehashing yes

# Logging
loglevel notice
logfile ""
