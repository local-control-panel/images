# Valkey (Redis-compatible) — WordPress object cache

# Memory
maxmemory 256mb
# allkeys-lru: evicts least-recently-used keys when full — best for WP object cache
maxmemory-policy allkeys-lru

# Persistence — save to disk every 5 min if ≥1 key changed
# Note: for a pure full-page-cache role (Souin), consider disabling persistence:
#   save ""
# (comment out the save lines below). If Valkey also stores PHP sessions, keep persistence ON.
# Disable with: save "" if you want pure in-memory cache
save 300 1
save 60 1000

# Network
bind 0.0.0.0
protected-mode no       # safe because the container is on the private backend network
port 6379
tcp-backlog 511
tcp-keepalive 300

# Authentication (optional — recommended if Valkey is exposed beyond the private backend network)
# Uncomment and set VALKEY_PASSWORD in .env, then update session.save_path in php.ini to include ?auth=PASSWORD
# requirepass change_me_valkey

# Performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
activerehashing yes
hz 15                        # event loop frequency — 15 is more responsive than default 10
activedefrag yes             # background memory defragmentation — reclaims fragmented memory from expired transients
active-defrag-threshold-lower 25     # start defrag when fragmentation > 25%
active-defrag-threshold-upper 100
active-defrag-cycle-min 1            # min CPU % for defrag — avoids spikes
active-defrag-cycle-max 25           # max CPU % for defrag
lazyfree-lazy-user-del yes  # async DEL operations

# Multi-core I/O threading — raises throughput 20-30% on 4+ core systems
io-threads 4
io-threads-do-reads yes

# Keyspace notifications — triggers expiry events for session cleanup
notify-keyspace-events Ex

# Logging
loglevel notice
logfile ""
